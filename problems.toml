The area under the blancmange curve is equal to ½, shown in pink in the diagram below.

Let $C$ be the circle with centre $\left ( \frac{1}{4}, \frac{1}{2} \right )$ and radius $\frac{1}{4}$, shown in black in the diagram.

What area under the blancmange curve is enclosed by $C$?
Give your answer rounded to eight decimal places in the form 0.abcdefgh.'''
solved = false

[227]
title = "The Chase"
statement = '''
The Chase is a game played with two dice and an even number of players.

The players sit around a table and the game begins with two opposite players having one die each. On each turn, the two players with a die roll it.

If the player rolls 1, then the die passes to the neighbour on the left.

If the player rolls 6, then the die passes to the neighbour on the right.

Otherwise, the player keeps the die for the next turn.

The game ends when one player has both dice after they have been rolled and passed; that player has then lost.

In a game with 100 players, what is the expected number of turns the game lasts?

Give your answer rounded to ten significant digits.'''
solved = false

[228]
title = "Minkowski Sums"
statement = '''
Let $S_n$ be the regular $n$-sided polygon – or shape – whose vertices

$v_k$ ($k = 1, 2, \dots, n$) have coordinates:

$$\begin{align}
x_k &= \cos((2k - 1)/n \times 180^\circ)\\
y_k &= \sin((2k - 1)/n \times 180^\circ)
\end{align}$$

Each $S_n$ is to be interpreted as a filled shape consisting of all points on the perimeter and in the interior.

The Minkowski sum, $S + T$, of two shapes $S$ and $T$ is the result of adding every point in $S$ to every point in $T$, where point addition is performed coordinate-wise: $(u, v) + (x, y) = (u + x, v + y)$.

For example, the sum of $S_3$ and $S_4$ is the six-sided shape shown in pink below:

How many sides does $S_{1864} + S_{1865} + \cdots + S_{1909}$ have?'''
solved = false

[229]
title = "Four Representations Using Squares"
statement = '''
Consider the number $3600$. It is very special, because

$$\begin{alignat}{2}
3600 &= 48^2 + &&36^2\\
3600 &= 20^2 + 2 \times &&40^2\\
3600 &= 30^2 + 3 \times &&30^2\\
3600 &= 45^2 + 7 \times &&15^2
\end{alignat}$$

Similarly, we find that $88201 = 99^2 + 280^2 = 287^2 + 2 \times 54^2 = 283^2 + 3 \times 52^2 = 197^2 + 7 \times 84^2$.

In 1747, Euler proved which numbers are representable as a sum of two squares.
We are interested in the numbers $n$ which admit representations of all of the following four types:

$$\begin{alignat}{2}
n &= a_1^2 + && b_1^2\\
n &= a_2^2 + 2 && b_2^2\\
n &= a_3^2 + 3 && b_3^2\\
n &= a_7^2 + 7 && b_7^2,
\end{alignat}$$
where the $a_k$ and $b_k$ are positive integers.

There are $75373$ such numbers that do not exceed $10^7$.

How many such numbers are there that do not exceed $2 \times 10^9$?'''
solved = false

[230]
title = "Fibonacci Words"
statement = '''
For any two strings of digits, $A$ and $B$, we define $F_{A, B}$ to be the sequence $(A,B,AB,BAB,ABBAB,\dots)$ in which each term is the concatenation of the previous two.

Further, we define $D_{A, B}(n)$ to be the $n$th digit in the first term of $F_{A, B}$ that contains at least $n$ digits.

Example:

Let $A=1415926535$, $B=8979323846$. We wish to find $D_{A, B}(35)$, say.

The first few terms of $F_{A, B}$ are:

$1415926535$

$8979323846$

$14159265358979323846$

$897932384614159265358979323846$

$1415926535897932384689793238461415{\color{red}\mathbf 9}265358979323846$

Then $D_{A, B}(35)$ is the $35$th digit in the fifth term, which is $9$.

Now we use for $A$ the first $100$ digits of $\pi$ behind the decimal point:

$14159265358979323846264338327950288419716939937510$

$58209749445923078164062862089986280348253421170679$

and for $B$ the next hundred digits:

$82148086513282306647093844609550582231725359408128$

$48111745028410270193852110555964462294895493038196$.

Find $\sum_{n = 0}^{17} 10^n \times D_{A,B}((127+19n) \times 7^n)$.'''
solved = false

