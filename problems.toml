[990]
title = "Addition Equations"
statement = '''
A string forms an addition equation if it consists of

- Digits, forming positive integers. No leading zeros are allowed.

- A single plus sign between integers.

- A single equality sign.

Most importantly, the equality must hold.

Example of strings of length 7 forming addition equations:

1+1+1=3

100=100

77=7+70

1+2=2+1

Note that strings are considered different even if they form equivalent equations, so for example here are three unique strings:

1+2=3

2+1=3

3=1+2

The following strings do not form valid addition equations:

1+1=3

1+1=02

0+1=1

+1=1

2-1=1

Let $A(n)$ be the number of strings of length not larger than $n$ forming addition equations.

You are given $A(3) = 9$, $A(5)=171$ and $A(7)=4878$.

Find $A(50)$. Give your answer modulo $10^9 + 7$.'''
solved = false

[991]
title = "Fruit Salad"
statement = '''
Find the sum of $\unicode{x1F34E} + \unicode{x1F34C} + \unicode{x1F34D}$ for all triples of positive integers $\unicode{x1F34E}, \unicode{x1F34C}, \unicode{x1F34D}$ which satisfy

$$\frac {\unicode{x1F34E}} {\unicode{x1F34C} + \unicode{x1F34D}} +
\frac {\unicode{x1F34C}} {\unicode{x1F34D} + \unicode{x1F34E}} +
\frac {\unicode{x1F34D}} {\unicode{x1F34E} + \unicode{x1F34D}} = 4$$

and $\unicode{x1F34E} + \unicode{x1F34C} + \unicode{x1F34D} \le 10^7$.

In case your device cannot display emoji properly, here is a rendered image of the problem statement.'''
solved = false

[992]
title = "Another Frog Jumping"
statement = '''
There are $n+1$ stones in a pond, numbered $0$ to $n$.

A frog starts by jumping onto stone $0$. It then jumps between the stones, only ever jumping to adjacent ones. For fixed $k$, it makes exactly $k+i$ visits to each stone $i$ for $0 \le i \lt n$; however, there are no restrictions on the number of times stone $n$ is visited. The frog can finish on any stone.

If $n=3$ and $k=2$ it would visit stone $0$ two times, stone $1$ three times and stone $2$ four times.

One way of achieving this is:

$0 \to 1 \to 0 \to 1 \to 2 \to 3 \to 2 \to 1 \to 2 \to 3 \to 2$.

Let $J(n,k)$ be the number of ways the frog can make such a journey.
For example, $J(3,2) = 17$, $J(6,1) = 1320$ and $J(6,5) = 16793280$.

Find $\displaystyle \sum_{s=0}^4 J(500,10^s)$. Give your answer modulo $987898789$.'''
solved = false

[993]
title = "Banana Beaver"
statement = '''
A beaver plays a game on an infinitely long number line.

When the game starts, the beaver is at position $0$, carrying $N$ bananas, and there are no other bananas on the number line.

At each step, the beaver will do the following according to the bananas it sees at positions $x$ and $x + 1$, where $x$ is the beaver's current position:

- If there is a banana at $x$ and another banana at $x + 1$, then the beaver will pick up a banana at position $x+1$, and then move itself to position $x-1$.

- If there is a banana at $x$ but there is no banana at $x+1$, then it will pick up a banana at $x$ and move itself to position $x+2$.

- If there is no banana at $x$ but there is a banana at $x+1$, then it will move a banana from position $x+1$ to position $x$ and move itself to position $x+2$.

- If there is no banana at $x$ and no banana at $x + 1$, then the beaver checks whether it still carries at least three bananas. If so, then it will drop a banana at each of the three positions $x - 1, x, x + 1$ and move itself to position $x-2$; otherwise the game ends.

For example, if $N \ge 3$, then the last rule applies to the starting position, so after $1$ step, there are $3$ bananas on the number line, at positions $-1, 0, 1$, with the beaver at position $-2$.

Similarly, if $N \ge 5$, then after $5$ steps, there are $5$ bananas on the number line, at positions $-2,-1,0,1,2$, with the beaver at position $-1$.

Let $\operatorname{BB}(N)$ be the position of the beaver when the game ends (which can be proved to always happen).

You are given $\operatorname{BB}(1000) = 1499$.

Find $\operatorname{BB}(10^{18})$.'''
solved = false

